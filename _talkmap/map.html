
<!DOCTYPE html>
<html>
<head>
	<title>Talk map</title>

	<!-- 1.9.4, not the old 1.0.0-beta.2 this was pinned to: that beta predates
	     zoomSnap/zoomDelta support entirely, so zoomSnap: 0 below was silently
	     ignored and every zoom (scroll, pinch, +/- control) snapped to whole
	     integer levels regardless. -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="leaflet_dist/screen.css" />

	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.css" />
	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css" />
	<script src="leaflet_dist/leaflet.markercluster-src.js"></script>
	<script src="org-locations.js"></script>

</head>
<body>

	<div id="map"></div>
	<script type="text/javascript">
		// The basemap is a single equirectangular image (see
		// _scripts/create_map.py), so EPSG4326 (plate carree) is the CRS
		// that maps its pixels to lat/lon linearly, with no Mercator
		// wrap-around or distortion.
		var worldBounds = L.latLngBounds([-90, -180], [90, 180]);

		// At this map's default (most zoomed-out) view the container shows
		// exactly -90..90 latitude (and, symmetrically, -180..180
		// longitude) with zero margin -- width and height both bind at
		// once, since the container's 2:1 aspect matches the world's. A
		// popup opened above/beside a marker near any of those four edges
		// needs room beyond it to render, and Leaflet's autoPan can't
		// create that room if maxBounds is locked to exactly the true
		// edge -- it has nowhere further to pan, so the popup renders
		// clipped instead (confirmed for Lappeenranta, our northernmost
		// talk at 61N, and the same applies east/west for talks like
		// Yokohama/Maui near +/-180). There's no real land/imagery beyond
		// either edge to show (poles, or the same world repeating), so
		// these buffers are just blank autoPan headroom, not a ghost copy
		// of real content -- 50/70 degrees covers this site's actual talks
		// with some room for future additions.
		var LAT_BUFFER_DEG = 50;
		var LON_BUFFER_DEG = 70;
		var panBounds = L.latLngBounds(
			[-90 - LAT_BUFFER_DEG, -180 - LON_BUFFER_DEG],
			[90 + LAT_BUFFER_DEG, 180 + LON_BUFFER_DEG]
		);

		var map = L.map('map', {
			crs: L.CRS.EPSG4326,
			center: [0, 0],
			zoom: 0,
			// Leaflet.markercluster needs a maxZoom at map-creation time for
			// its internal clustering grid; this placeholder is tightened to
			// the basemap's native resolution once it loads (see below).
			maxZoom: 12,
			maxBounds: panBounds,
			maxBoundsViscosity: 1.0,
			zoomSnap: 0, // continuous fractional zoom, not just whole levels
			worldCopyJump: false
		});

		var overlay = L.imageOverlay('/images/map.jpg', worldBounds, {
			attribution: 'Basemap derived from <a href="https://doi.org/10.25921/fd45-gt74">ETOPO 2022</a> (NOAA NCEI)'
		}).addTo(map);

		// Country borders as a vector overlay rather than baked into the
		// raster: stays crisp at any zoom level, and lines up directly with
		// this map's plate-carree CRS (plain lat/lon, no reprojection)
		// since the source data (Natural Earth 1:50m admin-0 countries,
		// picked over the coarser 1:110m for borders fine enough to track
		// the coastline detail at max zoom, and over the much heavier 1:10m
		// which is overkill given this basemap's own resolution ceiling) is
		// already WGS84.
		fetch('countries.geojson')
			.then(function (r) { return r.json(); })
			.then(function (data) {
				L.geoJSON(data, {
					style: { color: '#000', weight: 1, fill: false }
				}).addTo(map);
			});

		// Fit the image to fully cover the container (no letterboxing), and
		// forbid zooming out past that, so the globe always fills the map
		// area and never repeats.
		function fitToCover() {
			var minZoom = map.getBoundsZoom(worldBounds, true);
			map.setMinZoom(minZoom);
			if (map.getZoom() < minZoom) {
				map.setView([0, 0], minZoom);
			}
		}
		fitToCover();
		map.on('resize', fitToCover);

		// Cap zooming in at the basemap image's native pixel resolution, so
		// the browser is never asked to upscale (and blur) it beyond 1:1.
		//
		// Marker clustering is set up inside this same handler, after
		// setMaxZoom(): Leaflet.markercluster reads map.getMaxZoom() exactly
		// once, the first time markers are added (_generateInitialClusters),
		// and bakes it into its internal clustering grid. Adding markers
		// before this handler ran would bake in the placeholder maxZoom of
		// 12, so clusters that only separate somewhere past the basemap's
		// real ~5-6 zoom ceiling would stay stuck together forever, with no
		// way to zoom in further to split or click them.
		overlay.once('load', function () {
			var img = overlay.getElement();
			var p0 = map.project(worldBounds.getSouthWest(), 0);
			var p1 = map.project(worldBounds.getNorthEast(), 0);
			var worldWidthAtZoom0 = Math.abs(p1.x - p0.x);
			var nativeZoom = Math.log2(img.naturalWidth / worldWidthAtZoom0);
			// Leaflet.markercluster indexes its internal clustering grid by
			// zoom level and assumes those are integers; a fractional
			// maxZoom makes one of its loops walk past its lowest grid key
			// and crash (silently killing all marker rendering). Floor it
			// so clustering stays sane -- zoomSnap: 0 still gives smooth,
			// continuous zoom/pan below this integer ceiling, we just don't
			// reach the last fractional sliver of native resolution.
			var effectiveMaxZoom = Math.max(Math.floor(nativeZoom), Math.ceil(map.getMinZoom()));
			map.setMaxZoom(effectiveMaxZoom);

			// A smaller radius than the plugin default (80px) so that
			// genuinely distinct places render as separate markers, while
			// same-venue duplicates (identical coordinates) stay merged.
			// Checked against this site's actual talk locations: excluding
			// exact-coordinate duplicates (0px apart), the closest distinct
			// pair is ~37px apart at our current max zoom, so anything
			// under that -- 25px -- separates every genuinely distinct
			// place with room to spare for future geocoding jitter.
			var markers = L.markerClusterGroup({
				showCoverageOnHover: false,
				maxClusterRadius: 25
			});
			// 25% wider than Leaflet's default 300px maxWidth, so the long
			// talk titles/venues wrap into fewer, longer lines instead of a
			// tall narrow column.
			var popupOptions = { maxWidth: 375 };
			for (var i = 0; i < addressPoints.length; i++) {
				var a = addressPoints[i];
				var title = a[0];
				var marker = L.marker(new L.LatLng(a[1], a[2]), { title: title });
				marker.bindPopup(title, popupOptions);
				markers.addLayer(marker);
			}
			map.addLayer(markers);
		});
		window.addEventListener('resize', function () {
			map.invalidateSize();
		});
	</script>
</body>
</html>
